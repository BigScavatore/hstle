[package]
name = "hstle-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binario piccolo e leggero per il server da 768 MB
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

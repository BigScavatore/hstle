<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hstle</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 15px system-ui, sans-serif; background: #313338; color: #dbdee1; }
  header { padding: 12px 16px; background: #2b2d31; font-weight: 600;
           display: flex; justify-content: space-between; }
  #status { font-weight: 400; font-size: 13px; color: #949ba4; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 10px; }
  .msg b { color: #f2f3f5; margin-right: 8px; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #313338; }
  input { flex: 1; padding: 10px 12px; border: 0; border-radius: 6px;
          background: #383a40; color: inherit; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 6px;
           background: #5865f2; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header><span># generale</span><span id="status">connessione…</span></header>
<div id="log"></div>
<form id="form">
  <input id="text" placeholder="Scrivi un messaggio" autocomplete="off" autofocus>
  <button>Invia</button>
</form>
<script>
const log = document.getElementById('log');
const status = document.getElementById('status');
const form = document.getElementById('form');
const input = document.getElementById('text');

let name = localStorage.getItem('hstle-name');
if (!name) {
  name = (prompt('Scegli un nome') || 'anonimo').slice(0, 32);
  localStorage.setItem('hstle-name', name);
}

let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => status.textContent = 'connesso come ' + name;
  ws.onclose = () => { status.textContent = 'riconnessione…'; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t !== 'message') return;
    const row = document.createElement('div');
    row.className = 'msg';
    const who = document.createElement('b');
    who.textContent = m.name;            // textContent: niente HTML iniettato
    const body = document.createElement('span');
    body.textContent = m.text;
    row.append(who, body);
    log.append(row);
    log.scrollTop = log.scrollHeight;
  };
}
connect();

form.onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ name, text }));
  input.value = '';
};
</script>
</body>
</html>

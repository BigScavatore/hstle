<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  *{box-sizing:border-box} body{margin:0;background:#130d20;color:#ece8f8;font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  h1{font-size:17px;margin:0;padding:16px 18px 6px} .sub{color:#8d82aa;padding:0 18px 10px;margin:0}
  #grid{flex:1;overflow:auto;padding:6px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
  button.card{background:#1a1229;border:2px solid #2b1f44;border-radius:12px;padding:8px;color:inherit;text-align:left;cursor:pointer;font:inherit}
  button.card:hover{border-color:#5b34c4} button.card.on{border-color:#8b5cf6;background:#231836}
  img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:8px;display:block}
  .nm{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid #2b1f44}
  label{flex:1;display:flex;gap:8px;align-items:center;color:#cfc7e6} select{background:#08050f;color:inherit;border:1px solid #2b1f44;border-radius:8px;padding:7px 10px;font:inherit;min-width:0;flex:1}
  .btn{border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:#8b5cf6} .btn.g{background:#231836} .btn:disabled{opacity:.45;cursor:default}
  h2{grid-column:1/-1;font-size:12px;color:#8d82aa;margin:8px 0 0}
</style></head><body>
<h1>Cosa vuoi condividere?</h1>
<p class="sub">Uno schermo intero o una singola finestra. Per i giochi scegli lo schermo intero e, in basso, l'audio del solo gioco: così la chiamata non si risente.</p>
<div id="grid"></div>
<footer>
  <label id="audioRow">Audio&nbsp;<select id="audio"></select></label>
  <button class="btn g" id="cancel">Annulla</button>
  <button class="btn" id="ok" disabled>Condividi</button>
</footer>
<script>
let sel = null, canAudio = false, apps = [], byId = new Map();
const grid = document.getElementById('grid');
function card(s) {
  const b = document.createElement('button'); b.className = 'card'; b.type = 'button';
  const i = document.createElement('img'); i.src = s.thumb; i.alt = '';
  const n = document.createElement('div'); n.className = 'nm'; n.textContent = s.name; n.title = s.name;
  b.append(i, n);
  b.onclick = () => { sel = s.id; fillAudio(s); document.querySelectorAll('.card').forEach((c) => c.classList.toggle('on', c === b)); document.getElementById('ok').disabled = false; };
  b.ondblclick = () => { b.onclick(); go(); };
  return b;
}
function fillAudio(s) {
  const a = document.getElementById('audio');
  a.replaceChildren();
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; a.append(o); };
  if (canAudio) {
    if (s.app) add('app', 'Solo l\'audio di questa app');
    else if (s.screen) apps.forEach((x) => add('app:' + x.pid, 'Solo l\'audio di: ' + x.title));
    add('system', 'Tutto l\'audio del computer (si sentirà anche la chiamata)');
  }
  add('none', 'Nessun audio');
}
function go() {
  if (!sel) return;
  const v = document.getElementById('audio').value;
  hstleDesktop.choose(v.startsWith('app:') ? { id: sel, audio: 'app', pid: v.slice(4) } : { id: sel, audio: v });
}
(async () => {
  canAudio = await hstleDesktop.canShareAudio();
  fillAudio({ app: false });
  const r = await hstleDesktop.sources();
  const list = r.sources; apps = r.apps;
  for (const [title, f] of [['Schermi', (s) => s.screen], ['Finestre', (s) => !s.screen]]) {
    const part = list.filter(f); if (!part.length) continue;
    const h = document.createElement('h2'); h.textContent = title; grid.append(h);
    part.forEach((s) => grid.append(card(s)));
  }
})();
document.getElementById('ok').onclick = go;
document.getElementById('cancel').onclick = () => hstleDesktop.choose(null);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hstleDesktop.choose(null); });
</script></body></html>
